<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-List</title>
    <link rel="stylesheet" href="./src/css/themes.css">
    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/components/forms.css">
    <link rel="stylesheet" href="./src/css/components/buttons.css">
    <link rel="stylesheet" href="./src/css/pages/login.css">
    <script type="module" src="./src/js/login.js"></script>
</head>

<body>
    <main class="authContainer">
        <section class="authSide loginSide" id="loginSide" aria-label="Acesso à conta">
            <div class="sideText">
                <p class="authEyebrow">TODO-LIST</p>
                <h2>Bem-Vindo!</h2>
                <p>Organize suas tarefas e tenha mais espaço para o que importa.</p>
            </div>

            <div class="sideTextsBox">
                <div class="inputContainer">
                    <input type="email" placeholder="Digite seu email">
                </div>

                <div class="inputContainer">
                    <input type="password" placeholder="Digite sua senha">
                </div>

            </div>

            <button class="btn">Entrar</button>
        </section>
        <section class="authSide registerSide" id="registerSide" aria-label="Cadastro" hidden>
            <div class="sideText">
                <p class="authEyebrow">TODO-LIST</p>
                <h2>Bem-Vindo!</h2>
                <p>Organize suas tarefas e tenha mais espaço para o que importa.</p>
            </div>


            <form id="cadastroForm">
            <div class="sideTextsBox">
                <div class="inputContainer">
                    <input id="cadastrarName" type="text" placeholder="Digite seu nome" required>
                </div>

                <div class="sideTextsBox">
                    <div class="inputContainer">
                        <input id="cadastrarEmail" type="email" placeholder="Digite seu email" required>
                    </div>

                    <div class="inputContainer">
                        <input  id="cadastrarPassword" type="password" placeholder="Digite sua senha" required>
                    </div>

                </div>
                </div>

                <button class="btn" id="cadastrarBtn">Entrar</button>
                </form>
        </section>
        <div class="authPanel loginMode" id="authPanel">
            <div class="authPanelText" id="registerPrompt">
                <h1>TODO-LIST</h1>
                <p>Ainda não tem uma conta?</p>
                <button class="authToggleButton" id="showRegisterButton" type="button">Se cadastrar</button>
            </div>
            <div class="authPanelText" id="loginPrompt" hidden>
                <h1>TODO-LIST</h1>
                <p>Já tem uma conta?</p>
                <button class="authToggleButton" id="showLoginButton" type="button">Fazer login</button>
            </div>
        </div>
    </main>
    <script type="module" src="./src/js/loginManager.js"></script>
</body>

</html>
