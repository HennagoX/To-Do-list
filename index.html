<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/css/style.css" > 
    <title></title>
</head>
<body>
    <main>
        <header>
            <h1>TODO-LIST</h1>
            <p>Crie suas tarefas.</p>
        </header>
        
        <button class="createButton" id="createTaskButton">
                 +
        </button>

        <ul class="taskList" id="taskList">
           <li class="taskCard">
             <h2>1.</h2>
             <input maxlength="30" placeholder="Digite sua tarefa aqui..." class="taskInput" required>
              <input class="taskCheck" type="checkbox" checked>
           </li>
        </ul>
        
    </main>
    <script src="src/js/addTask.js"></script>
</body>
</html>
